<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Log do Sistema - ChatGPT</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    body {
      font-family: monospace;
      background: #1e1e1e;
      color: #00ff90;
      padding: 20px;
    }
    .log-entry {
      margin-bottom: 15px;
      border-left: 4px solid #00ff90;
      padding-left: 10px;
    }
    .timestamp {
      color: #ccc;
      font-size: 0.9em;
    }
  </style>
</head>
<body>
  <h2>🧠 Log do Sistema - Acompanhamento do ChatGPT</h2>
  <div class="log-entry">
    <div class="timestamp">[30/04/2025 - 21:30]</div>
    Sistema inicial criado com painel, login e estrutura de rotas.
  </div>
  <div class="log-entry">
    <div class="timestamp">[30/04/2025 - 21:45]</div>
    Adicionada área de administração com senha separada.
  </div>
</body>
</html>
